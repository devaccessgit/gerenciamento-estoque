<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Estoque</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- scripts deferidos -->
  <script src="auth.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body class="bg-light">
  <script>
    // redireciona para login se não estiver autenticado
    if (!localStorage.getItem('logado')) {
      window.location.href = 'login.html';
    }
  </script>

  <!-- botão de logout -->
  <div class="d-flex justify-content-end p-3">
    <button onclick="logout()" class="btn btn-outline-danger">Sair</button>
  </div>

  <div class="container py-4">
    <h1 class="mb-4 text-center">📦 Controle de Estoque</h1>

    <form id="product-form" class="row g-3 align-items-end">
      <div class="col-md-2 col-sm-6">
        <input type="text" id="codigo" class="form-control" placeholder="Código do Produto" required>
      </div>
      <div class="col-md-2 col-sm-6">
        <input type="date" id="dataEntrada" class="form-control" required>
      </div>
      <div class="col-md-2 col-sm-12">
        <input type="text" id="nome" class="form-control" placeholder="Nome do Produto" required>
      </div>
      <div class="col-md-2 col-sm-6">
        <input type="number" id="quantidade" class="form-control fw-bold" placeholder="Quantidade" required>
      </div>
      <div class="col-md-2 col-sm-6">
        <input type="number" id="preco" class="form-control fw-bold" placeholder="Preço (R$)" step="0.01" required>
      </div>
      <div class="col-md-1 col-sm-8">
        <button type="submit" class="btn btn-success w-100">Adicionar</button>
      </div>
    </form>

    <!-- área de mensagens de feedback -->
    <div id="mensagens" class="my-2"></div>

    <div class="mt-3">
      <input type="text" id="filtro" class="form-control" placeholder="🔍 Filtrar por nome ou código..." />
    </div>

    <div class="my-3 d-flex gap-2 flex-wrap">
      <button onclick="exportarCSV()" class="btn btn-outline-secondary">📁 Exportar CSV</button>
      <button onclick="exportarPDF()" class="btn btn-outline-secondary">🧾 Exportar PDF</button>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th>Código</th>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
            <th>Total</th>
            <th>Data de Entrada</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="product-list"></tbody>
        <tfoot>
          <tr>
            <td colspan="5"><strong>Total Geral</strong></td>
            <td colspan="2">
              <span id="total-geral" class="badge bg-success fs-6">R$ 0,00</span>
            </td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <!-- função de logout -->
  <script>
    function logout() {
      localStorage.removeItem('logado');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
